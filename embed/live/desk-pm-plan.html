<!doctype html>
<html lang="th" data-vo-theme="erp" data-theme="light">
<head>
<title>แผน PM คอมเพรสเซอร์</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="vibeops-themes.css">
<link rel="stylesheet" href="vibeops-app.css">
<style>
/* แถบบนของโปรแกรมจริง (ยกจาก @media min-width:1024px ของ vibeops-app.css ให้แสดงทุกขนาด iframe) */

  [data-desktop-nav] {
    background: var(--vo-brand-gradient, linear-gradient(100deg,#00bec4 0%,#278ed2 36%,#505bdb 66%,#8125e9 100%));
    box-shadow: 0 3px 12px #24345b12;
    margin-bottom: 0;
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center;
    gap: 20px;
    padding: 12px 24px;
  }
  [data-desktop-nav] .floor-brand-tier, [data-desktop-nav] .floor-header-inner, [data-desktop-nav] .floor-nav-tier, [data-desktop-nav] .floor-nav-inner {
    display: contents;
  }
  [data-desktop-nav] .floor-brand {
    grid-column: 1;
    grid-row: 1;
  }
  [data-desktop-nav] .floor-brand > a > div:first-child {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }
  [data-desktop-nav] .floor-brand > a > div:first-child svg {
    width: 23px;
    height: 23px;
  }
  [data-desktop-nav] .floor-brand a span:first-child {
    font-size: 21px;
  }
  [data-desktop-nav] .floor-brand a span + span, [data-desktop-nav] .floor-company-divider {
    display: none;
  }
  [data-desktop-nav] .floor-company {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  [data-desktop-nav] .floor-account {
    grid-column: 3;
    grid-row: 1;
    gap: 8px;
  }
  [data-desktop-nav] .floor-account > .w-px {
    display: none;
  }
  [data-desktop-nav] .floor-profile > span {
    max-width: 110px;
    font-size: 14px;
  }
  [data-desktop-nav] .floor-profile > div {
    width: 32px;
    height: 32px;
  }
  [data-desktop-nav] .floor-header-inner a span {
    font-weight: 500;
  }
  [data-desktop-nav] nav > a,[data-desktop-nav] nav > div > button {
    position: relative;
    background: transparent;
  }
  [data-desktop-nav] nav [aria-current="page"] {
    background: #ffffff26;
  }
  [data-desktop-nav] nav [aria-current="page"]::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 30%;
    right: 30%;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: #fff;
  }
  [data-desktop-nav] nav > a:hover,[data-desktop-nav] nav > div > button:hover,[data-desktop-nav] nav button[aria-expanded="true"] {
    background: #ffffff26;
  }
  [data-desktop-nav] .floor-nav-tier {
    height: auto;
    padding: 0 0 10px;
    margin: 0;
  }
  [data-desktop-nav] nav {
    grid-column: 2;
    grid-row: 1;
    width: 100%;
    min-width: 0;
    height: 52px;
    gap: 4px;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  [data-desktop-nav] nav > a, [data-desktop-nav] nav > div {
    flex: 0 0 auto;
    min-width: 0;
  }
  [data-desktop-nav] nav > a, [data-desktop-nav] nav > div > button {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    gap: 6px;
    font-size: 14px;
    font-weight: 400;
    border: 0;
    border-radius: 7px;
    color: #fff;
  }
  [data-desktop-nav] nav > a:focus-visible,[data-desktop-nav] nav > div > button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  [data-desktop-nav] nav > a > svg, [data-desktop-nav] nav > div > button > svg:first-child {
    color: #fff;
    width: 21px;
    height: 21px;
  }
  [data-desktop-nav] nav > div > button > svg:last-child {
    width: 12px;
    color: #ffffffb3;
  }
  [data-desktop-nav] nav > div:nth-last-child(-n+2) > .absolute {
    left: auto;
    right: 0;
  }


html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{font-family:var(--vo-font,"Sarabun",Tahoma,sans-serif);color:var(--vo-text)}
.stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--vo-shell-bg,#fff);display:flex;flex-direction:column}
.stage [data-desktop-nav]{flex:none}
.pg{flex:1;min-height:0;overflow:hidden;padding:20px 32px 0}
.cur{position:absolute;z-index:99;width:28px;height:28px;margin:-3px 0 0 -5px;pointer-events:none;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .25s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.rip{position:absolute;z-index:98;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(124,58,237,.32);animation:lvRip .6s ease-out forwards;pointer-events:none}
@keyframes lvRip{from{transform:scale(.2);opacity:1}to{transform:scale(1.7);opacity:0}}
.pressed{transform:scale(.97)}
.focus{border-color:var(--vo-focus,var(--vo-primary))!important;box-shadow:0 0 0 3px var(--vo-primary-soft)}
.fx-in{animation:lvIn .45s ease-out both}
@keyframes lvIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-pop{animation:lvPop .4s ease-out}
@keyframes lvPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fx-flash{animation:lvFlash 1s ease-out}
@keyframes lvFlash{0%{background:var(--vo-primary-soft)}100%{background:transparent}}
.nofx,.nofx *{transition:none!important;animation:none!important}
[hidden]{display:none!important}
.toast{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600;background:var(--vo-ok-bg);color:var(--vo-ok)}
.row-hl>td{background:var(--vo-primary-soft)!important;transition:background .3s}
.cell-bad{background:var(--vo-bad-bg)!important;color:var(--vo-bad)!important;font-weight:700;transition:background .4s,color .4s}
.cell-plan{background:var(--vo-ok-bg)!important;color:var(--vo-ok)!important;font-weight:700}
.vo-tabs-pill{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--vo-surface-2);align-self:flex-start}
.vo-tabs-pill button{padding:6px 14px;border-radius:8px;font-size:15px;color:var(--vo-text-2)}
.vo-tabs-pill button[aria-selected=true]{background:var(--vo-surface);color:var(--vo-text);font-weight:600;box-shadow:0 1px 2px #0001}
</style>
<script>
/* ชิ้นส่วนหน้าตา VibeOps (คลาสคัดจาก dom/*.html ของโปรแกรมจริง) */
window.VO = {
  TH: 'px-3 py-3 text-sm font-semibold text-on-primary select-none border-b border-primary bg-primary-bg relative group after:absolute after:right-0 after:top-3 after:bottom-3 after:w-px after:bg-line last:after:hidden',
  TD: 'px-3 text-sm text-text transition-colors whitespace-nowrap border-b border-line py-2.5',
  TR: 'group transition-all duration-200 outline-none bg-surface hover:bg-surface-2',
  BTN: 'vo-button inline-flex items-center justify-center rounded-control font-medium select-none whitespace-nowrap shrink-0 transition-colors duration-150 min-h-tap px-4 text-base gap-2',
  INPUT: 'w-full bg-surface rounded-control border outline-none text-base text-text placeholder:text-muted border-line-strong transition-colors h-tap px-3',
  th(t, o = {}) { return `<th class="${this.TH}${o.r ? ' text-right' : ''}" style="${o.w ? 'width:' + o.w + 'px' : ''}"><div class="flex items-center justify-between space-x-2 w-full group"><div class="flex items-center gap-1 flex-1 min-w-0 select-none${o.r ? ' justify-end' : ''}"><span class="font-semibold text-inherit leading-tight whitespace-nowrap">${t}</span></div></div></th>`; },
  td(h, o = {}) { return `<td class="${this.TD}${o.r ? ' text-right' : ''}${o.c ? ' ' + o.c : ''}"${o.a || ''}>${h}</td>`; },
  table(ths, rows, tb = '') { return `<div class="bg-surface flex flex-col"><div class="overflow-x-auto flex-1 min-h-0 min-w-0 max-w-full"><table class="vo-super-table w-full text-left border-collapse table-fixed"><thead class="sticky top-0 z-10"><tr>${ths}</tr></thead><tbody class="divide-y divide-line"${tb}>${rows}</tbody></table></div></div>`; },
  badge(kind, t) {
    const m = { ok: ['bg-ok-bg text-ok', 'bg-ok'], bad: ['bg-bad-bg text-bad', 'bg-bad'], warn: ['bg-warn-bg text-warn', 'bg-warn'], info: ['bg-info-bg text-info', 'bg-info'], mute: ['bg-surface-2 text-text-2', 'bg-text-2'] }[kind];
    return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-sm font-semibold whitespace-nowrap ${m[0]}"><span aria-hidden="true" class="size-2 shrink-0 rounded-full ${m[1]}"></span>${t}</span>`;
  },
  btn(t, ic, kind = 'p', attr = '') {
    const c = kind === 'p' ? 'bg-primary-bg text-on-primary hover:bg-primary-hover' : 'bg-surface text-text border border-line-strong hover:bg-surface-2';
    return `<button type="button" class="${this.BTN} ${c}" ${attr}>${ic ? `<i data-ic="${ic}" data-s="18"></i>` : ''}${t}</button>`;
  },
  card(title, body, o = {}) { return `<section class="vo-card ${o.p === false ? '' : 'p-4'}" ${o.a || ''}><div class="mb-3 flex items-center justify-between gap-3 ${o.p === false ? 'px-4 pt-4' : ''}"><h2 class="text-base font-medium text-text">${title}</h2>${o.right || ''}</div>${body}</section>`; },
  pagehead(back, h1, o = {}) {
    return `<header class="border-b border-line bg-surface-2 px-6 py-2"><div class="flex min-h-tap items-center justify-between gap-3"><div class="flex min-w-0 items-center gap-2">${back ? `<button type="button" class="inline-flex min-h-tap items-center gap-1.5 rounded-md px-2 text-base text-text-2"><i data-ic="back" data-s="18"></i> <span>${back}</span></button>` : ''}<div class="min-w-0 pl-1">${o.code ? `<div class="text-sm text-text-2">${o.code}</div>` : ''}<h1 class="text-lg leading-snug text-text"${o.h1a || ''}>${h1}</h1></div>${o.badge ? `<div class="ml-2 shrink-0">${o.badge}</div>` : ''}</div><div class="flex shrink-0 items-center gap-3">${o.right || ''}</div></div></header>`;
  }
};
</script>

<style>
.opt{min-height:56px;border-radius:10px;border:1px solid var(--vo-line);background:var(--vo-surface);padding:10px 16px;text-align:left;font-size:16px;color:var(--vo-text)}
.opt[aria-pressed=true]{border-color:var(--vo-primary);background:color-mix(in srgb,var(--vo-primary) 10%,transparent)}
.opt b{display:block;font-weight:500}.opt span{display:block;color:var(--vo-text-2)}
.fake{display:flex;align-items:center;height:40px;border:1px solid var(--vo-line-strong);border-radius:var(--vo-radius-control,8px);padding:0 12px;background:var(--vo-surface);font-size:16px;color:var(--vo-text)}
.fake.sel{justify-content:space-between}
.fake.num{justify-content:flex-end;height:36px;font-variant-numeric:tabular-nums}
.fake:empty::before{content:attr(data-ph);color:var(--vo-muted)}
.freq{border-radius:10px;background:var(--vo-surface-2);padding:10px 16px;font-size:18px}
.tier{border:1px solid var(--vo-line);border-radius:12px;padding:14px 16px}
#sc{position:relative}
.fc li{border:1px solid var(--vo-line);border-radius:8px;padding:6px 12px;font-size:15px}
.cb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid var(--vo-line-strong);border-radius:6px;color:transparent;background:var(--vo-surface)}
tr.on .cb{background:var(--vo-primary);border-color:var(--vo-primary);color:#fff}
tr.on>td{background:color-mix(in srgb,var(--vo-primary) 7%,transparent)}
.fc li.yr{border-color:var(--vo-primary);background:color-mix(in srgb,var(--vo-primary) 10%,transparent)}
</style>
<style>*{caret-color:transparent!important}.caret,.cursor-blink{display:none!important}</style></head>

        tier('t3', 'รายปี', 'ทุก 4 รอบ (≈ ทุก 12 เดือน)', 'CL-GA37-Y · ยกเครื่อง 14 ข้อ', T3) + `</div>`, { right: V.btn('เพิ่มระดับงาน', 'plus', 's', 'id="bTier"') });

    st.querySelector('#hdPlan').innerHTML = V.pagehead('แผน PM', 'PM คอมเพรสเซอร์ GA37 · 3 เครื่อง', { code: 'PM-CMP-GA37 · บำรุงรักษาตามแผน', badge: V.badge('ok', 'ใช้งาน'), right: `<span id="tst2"></span>` + V.btn('แก้ไขแผน', 'pencil', 'p') });
    const bomRows = PB.map((r, i) => `<tr class="${V.TR}" id="pb${i}">${V.td(`<span class="num text-sm text-muted">${i + 1}</span>`)}${V.td(`<span class="block truncate">${r[1]}</span><span class="block text-xs tabular-nums text-text-2">${r[0]}</span>`)}${V.td(r[2])}${V.td(r[3])}${V.td(r[4])}${V.td(`<span class="tabular-nums n" data-v="${r[5]}">–</span>`, { r: 1 })}${V.td(`<span class="tabular-nums a" data-v="${r[6]}">–</span>`, { r: 1 })}${V.td(`<span class="st"></span>`)}</tr>`).join('');
    st.querySelector('#planBody').innerHTML = `<main class="flex min-w-0 flex-col gap-4">
      <div class="vo-tabs-pill"><button type="button" aria-selected="true">ภาพรวมแผน</button><button type="button">ประวัติรอบ (0)</button></div>
      ${V.card('ครบครั้งถัดไป', `<div class="flex flex-wrap items-baseline gap-x-4 gap-y-1"><span class="text-4xl font-medium tabular-nums text-text">7 ธ.ค. 69</span><span class="text-lg text-text-2">อีก 18 วัน</span><span class="text-base text-text-2">ตามวัน (ครบ 3 เดือน ก่อนมิเตอร์ถึง 500 ชม.)</span></div>`)}
      ${V.card('พยากรณ์ 12 รอบถัดไป · 3 เครื่อง × 12 รอบ = 36 ใบงาน', `<ol class="fc grid gap-2" style="grid-template-columns:repeat(4,1fr)">${FC.map(f => `<li class="${f[2] ? 'yr' : ''}" hidden><span class="block tabular-nums font-medium">${f[0]}</span><span class="block text-text-2">3 เครื่อง · ${f[1]}</span></li>`).join('')}</ol>`)}
      <section class="vo-card" id="bomCard"><div class="mb-2 flex items-center justify-between gap-3 px-4 pt-4"><h2 class="text-base font-medium text-text">อะไหล่และวัสดุต่อรอบ (BOM · 5)</h2><span id="short"></span></div>
        <p class="px-4 pb-3 text-base text-text-2">"ใช้ใน 90 วัน" = รวมรอบที่จะครบภายใน 90 วัน ตาม "ทุกกี่รอบ" · เทียบของพร้อมจ่ายในคลัง</p>
        ${V.table(V.th('#', { w: 44 }) + V.th('อะไหล่/วัสดุ') + V.th('ระดับงาน', { w: 104 }) + V.th('ทำอะไร', { w: 140 }) + V.th('ทุกกี่รอบ', { w: 92 }) + V.th('ใช้ใน 90 วัน', { w: 106, r: 1 }) + V.th('พร้อมจ่าย', { w: 96, r: 1 }) + V.th('สต็อก', { w: 128 }), bomRows)}</section>
      </main>
      <aside class="flex min-w-0 flex-col gap-4">
      ${V.card('ข้อมูลแผน', `<dl class="divide-y divide-line">${[['ความถี่', 'ทุก 3 เดือน หรือ 500 ชม. แล้วแต่ถึงก่อน'], ['ระดับงาน', 'รายเดือน · ราย 3 เดือน · รายปี'], ['วิธีนับ', 'นับจากวันที่ทำเสร็จจริง'], ['ออกใบล่วงหน้า', '7 วัน'], ['ทีม', 'ทีมซ่อมอาคาร A'], ['ที่ตั้ง', 'อาคาร A › ห้องคอมเพรสเซอร์'], ['เวลาประมาณ', '2 ชม. ต่อเครื่อง'], ['มิเตอร์', 'ชั่วโมงเดินของแต่ละเครื่อง']].map(d => `<div class="grid gap-3 py-1.5 text-base" style="grid-template-columns:7.5rem 1fr"><dt class="text-text-2">${d[0]}</dt><dd class="min-w-0 break-words text-text">${d[1]}</dd></div>`).join('')}</dl>`)}
      ${V.card('เครื่องในแผน (3)', `<ul class="divide-y divide-line"><li class="flex items-start justify-between gap-3 py-2 text-base"><span class="min-w-0"><span class="block"><span class="tabular-nums">CMP-01</span> · คอมเพรสเซอร์ GA37 ตัวที่ 1</span><span class="block text-text-2">ห้องคอมเพรสเซอร์ อาคาร A</span></span><span class="shrink-0 text-right tabular-nums">7 ธ.ค. 69<span class="block text-text-2">อีก 18 วัน</span></span></li><li class="flex items-start justify-between gap-3 py-2 text-base"><span class="min-w-0"><span class="block"><span class="tabular-nums">CMP-02</span> · คอมเพรสเซอร์ GA37 ตัวที่ 2</span><span class="block text-text-2">ห้องคอมเพรสเซอร์ อาคาร A</span></span><span class="shrink-0 text-right tabular-nums">7 ธ.ค. 69<span class="block text-text-2">อีก 18 วัน</span></span></li><li class="flex items-start justify-between gap-3 py-2 text-base"><span class="min-w-0"><span class="block"><span class="tabular-nums">CMP-03</span> · คอมเพรสเซอร์ GA37 ตัวที่ 3</span><span class="block text-text-2">ห้องคอมเพรสเซอร์ อาคาร A</span></span><span class="shrink-0 text-right tabular-nums">7 ธ.ค. 69<span class="block text-text-2">อีก 18 วัน</span></span></li></ul>`)}
      </aside>`;
  },
  steps: [
    { cap: 'หัวหน้าเปิดฟอร์มสร้างแผน PM ใหม่', run: async a => {} },
    { cap: 'ตั้งชื่อแผน แล้วเลือกที่ตั้งแบบเดียวกับแจ้งซ่อม: อาคาร A › ห้องคอมเพรสเซอร์', run: async a => {
      await a.click('#fName'); await a.type('#fName', 'PM คอมเพรสเซอร์ GA37', 30);
      await a.click('#fBld'); a.set('#fBld [data-v]', 'อาคาร A'); a.cls('#fBld [data-v]', '', 'text-muted');
      await a.click('#fZone'); a.set('#fZone [data-v]', 'ห้องคอมเพรสเซอร์'); a.cls('#fZone [data-v]', '', 'text-muted');
      a.show('#mBox'); await a.stagger('#mBox tr[id]', 110);
    } },
    { cap: 'ติ๊กได้หลายเครื่อง: CMP-01 CMP-02 CMP-03 — แผนเดียวใช้กับทั้ง 3 เครื่อง', run: async a => {
      a.show('#chips');
      for (let i = 0; i < 3; i++) {
        await a.click(`#m${i} .cb`); a.cls(`#m${i}`, 'on'); a.show(`#ch${i}`, 'fx-pop'); a.$('#selN').textContent = `เลือกแล้ว ${i + 1} เครื่อง`;
      }
      a.off();
    } },
    { cap: 'นับรอบแบบ ทุก 3 เดือน หรือ 500 ชม. แล้วแต่อะไรถึงก่อน', run: async a => {
      await a.scroll('#sc', topIn(a, '#sc', '#formBody > section:nth-child(2)') - 6);
      await a.click('#oBoth', el => a.pick(el)); a.show('#freqIn');
      await a.click('#fMon'); await a.type('#fMon', '3', 80);
      await a.click('#fHr'); await a.type('#fHr', '500', 80); await a.w(150);
      a.show('#freq', 'fx-pop');
    } },
    { cap: 'ระดับรายเดือน: เช็กลิสต์ตรวจประจำเดือน และจาระบี EP2', run: async a => {
      await a.scroll('#sc', topIn(a, '#sc', '#formBody > section:nth-child(3)') - 6);
      await a.click('#bTier'); a.show('#t1'); a.set('#tierN', '(1 ระดับ)');
      await a.w(300); await a.stagger('[data-r=t1]', 140);
    } },
    { cap: 'ระดับราย 3 เดือน: เปลี่ยนไส้กรองอากาศทุกรอบ น้ำมันคอมเพรสเซอร์ทุก 2 รอบ', run: async a => {
      a.show('#t2'); a.set('#tierN', '(2 ระดับ)');
      await a.scroll('#sc', botTo(a, '#sc', '#t2'));
      await a.stagger('[data-r=t2]', 220);
    } },
    { cap: 'ระดับรายปี: ไส้กรองแยกน้ำมันและชุดซ่อมวาล์ว', run: async a => {
      a.show('#t3'); a.set('#tierN', '(3 ระดับ)');
      await a.scroll('#sc', botTo(a, '#sc', '#t3'));
      await a.stagger('[data-r=t3]', 220);
    } },
    { cap: 'กดบันทึกแผน — พยากรณ์ 12 รอบถัดไปของทั้ง 3 เครื่องให้ทันที', run: async a => {
      await a.click('#bSave'); a.toast('#tst', 'บันทึกแล้ว'); await a.w(600);
      a.off(); a.$('#vForm').style.display = 'none'; a.$('#vPlan').style.display = 'flex'; a.show('#vPlan');
      await a.w(400); await a.stagger('.fc li', 110);
    } },
    { cap: 'รวมอะไหล่ 3 เครื่องที่ใช้ใน 90 วัน เทียบของพร้อมจ่าย — ไส้กรองน้ำมันขาด 3 ชิ้น', run: async a => {
      await a.scroll('#sc2', botTo(a, '#sc2', '#bomCard'), 700);
      for (let i = 0; i < PB.length; i++) {
        const r = PB[i], dec = String(r[5]).includes('.') || String(r[6]).includes('.') ? 1 : 0;
        await a.count(`#pb${i} .n`, r[5], { dec, dur: 450 }); await a.count(`#pb${i} .a`, r[6], { dec, dur: 450 });
        const st = a.$(`#pb${i} .st`);
        st.innerHTML = r[5] === 0 ? V.badge('mute', 'ยังไม่ถึงคิว') : r[6] >= r[5] ? V.badge('ok', 'พอ') : V.badge('bad', 'ขาด ' + (r[5] - r[6]));
        if (!a.fast) { st.classList.remove('fx-pop'); void st.offsetWidth; st.classList.add('fx-pop'); }
        if (r[6] < r[5]) a.cls(`#pb${i}`, 'row-hl');
        await a.w(120);
      }
      a.set('#short', V.badge('bad', 'ขาด 1 รายการ ก่อน 7 ธ.ค.'));
    } },
  ]
});
</script>
</body>
</html>
