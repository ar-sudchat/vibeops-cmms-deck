<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
.stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--vo-shell-bg,#fff);font-family:var(--vo-font,"Sarabun",sans-serif)}
.stage [data-desktop-nav]{position:relative}
.scr{height:734px;overflow:hidden}
.cur{position:absolute;z-index:200;pointer-events:none;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .25s;transform:translate(-5px,-3px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.rip{position:absolute;z-index:199;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:color-mix(in srgb,var(--vo-primary,#5B2BE0) 45%,transparent);pointer-events:none;animation:rip .65s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}
.pressed{transform:scale(.97)}
.fx-in{animation:fxin .42s ease-out both}
@keyframes fxin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-flash{animation:fxflash 1s ease-out}
@keyframes fxflash{0%{background:color-mix(in srgb,var(--vo-primary,#5B2BE0) 18%,transparent)}100%{background:transparent}}
.fx-pop{animation:fxpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes fxpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.nofx *,.nofx{transition:none!important;animation:none!important}
.focus{outline:2px solid var(--vo-primary,#5B2BE0);outline-offset:0;border-color:var(--vo-primary,#5B2BE0)!important}
.toast{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 4px 14px rgba(20,20,40,.12)}
.toast.ok{background:var(--vo-ok-bg,#e8f6ee);color:var(--vo-ok,#13804a)}
.toast.info{background:var(--vo-primary-soft,#efe9ff);color:var(--vo-primary,#5B2BE0)}
[hidden]{display:none!important}
.lv-cap{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:300;background:rgba(20,20,30,.82);color:#fff;padding:8px 16px;border-radius:10px;font:16px "Sarabun",sans-serif}

.lc-hi td{background:var(--vo-primary-soft)!important}
.lc-hi td:first-child{box-shadow:inset 3px 0 0 var(--vo-primary)}
.lc-down{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;background:var(--vo-bad-bg,#fde8e8);color:var(--vo-bad,#c62828);font-weight:500}
.lc-down i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.lc-pulse{animation:lcp 1.2s ease-in-out 2}
@keyframes lcp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--vo-bad,#c62828) 22%,transparent)}}
.vo-super-table{border-collapse:separate!important;border-spacing:0}
.vo-super-table td{height:37px;box-sizing:border-box;padding-top:4px!important;padding-bottom:4px!important}
</style>
<style>*{caret-color:transparent!important}.caret,.cursor-blink{display:none!important}</style></head>

<script>
/* หัวหน้า วรวุฒิ เจริญผล ดูผังสถานที่ — ไล่จากอาคาร A ลงถึงไลน์ 2 ที่ IMM-06 หยุดอยู่ (ข้อมูลตัวอย่าง) */
const I = (n, s) => LIVE.ic(n, s);
const TH = 'px-3 py-3 text-sm font-semibold text-on-primary select-none border-b border-primary bg-primary-bg relative';
const COLS = [['#', 56], ['', 48], ['สถานที่'], ['รหัส', 120], ['ระดับ', 110], ['ทีมรับผิดชอบ', 300], ['เครื่อง', 100, 1], ['เรื่องที่เปิดอยู่', 140, 1], ['เครื่องหยุด', 120, 1]];
document.getElementById('thead').innerHTML = COLS.map((c, i) => `<th class="${TH}${c[2] ? ' text-right' : ''}"${c[1] ? ` style="width:${c[1]}px"` : ''}>${i === 1 ? `<span style="display:flex;justify-content:center;opacity:.85">${I('updown', 18)}</span>` : c[0]}</th>`).join('');
const TD = 'px-3 text-sm text-text transition-colors whitespace-nowrap border-b border-line border-r border-line last:border-r-0 py-2';
const dash = '<span class="text-muted">—</span>';
const val = (v, red) => v === '—' ? dash : red ? `<span class="font-medium text-bad">${v}</span>` : v;
function row(r) {
  // r: {id, no, n, name, code, lvl, team, as, op, dn, depth, exp, kids, hidden}
  const pad = [0, 28, 56][r.depth];
  const exp = r.kids ? `<button class="absolute inset-0 flex items-center justify-center text-muted" aria-expanded="${r.exp ? 'true' : 'false'}" id="x-${r.id}">${I(r.exp ? 'down' : 'right', 20)}</button>` : '';
  const name = r.depth === 0 ? `<span class="font-medium text-text">${r.name}</span>` : `<span class="shrink-0 tabular-nums text-sm text-text-2">${r.n}</span><span class="text-text">${r.name}</span>`;
  return `<tr id="r-${r.id}" class="group bg-surface"${r.hidden ? ' hidden' : ''}>
    <td class="${TD}"><span class="num text-sm text-muted">${r.no || ''}</span></td>
    <td class="relative p-0! ${TD}">${exp || '&nbsp;'}</td>
    <td class="${TD}"><span class="flex min-w-0 items-baseline gap-2" style="padding-left:${pad}px">${name}</span></td>
    <td class="${TD}"><span class="tabular-nums text-text-2">${r.code}</span></td>
    <td class="${TD} hidden xl:table-cell">${r.lvl}</td>
    <td class="${TD} hidden lg:table-cell"><span class="${r.depth ? 'text-text-2' : 'text-text'}" id="t-${r.id}">${r.team}</span></td>
    <td class="${TD} text-right" id="a-${r.id}">${val(r.as)}</td>
    <td class="${TD} text-right" id="o-${r.id}">${val(r.op)}</td>
    <td class="${TD} text-right" id="d-${r.id}">${val(r.dn, 1)}</td></tr>`;
}
const TA = 'ทีมซ่อมอาคาร A (ฉีด)', TB = 'ทีมซ่อมอาคาร B–C (เป่า บรรจุ คลัง)', TU = 'ทีมสาธารณูปโภคและอาคาร';
const A0 = { kids: 1, depth: 0, lvl: 'อาคาร' };
const Z = (o) => Object.assign({ depth: 1, lvl: 'โซน', team: TA, hidden: 1 }, o);
const ROWS = [
