<!doctype html>
<html lang="th" data-vo-theme="erp" data-theme="light">
<head>
<title>แผนความต้องการอะไหล่</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="vibeops-themes.css">
<link rel="stylesheet" href="vibeops-app.css">
<style>
/* แถบบนของโปรแกรมจริง (ยกจาก @media min-width:1024px ของ vibeops-app.css ให้แสดงทุกขนาด iframe) */

  [data-desktop-nav] {
    background: var(--vo-brand-gradient, linear-gradient(100deg,#00bec4 0%,#278ed2 36%,#505bdb 66%,#8125e9 100%));
    box-shadow: 0 3px 12px #24345b12;
    margin-bottom: 0;
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center;
    gap: 20px;
    padding: 12px 24px;
  }
  [data-desktop-nav] .floor-brand-tier, [data-desktop-nav] .floor-header-inner, [data-desktop-nav] .floor-nav-tier, [data-desktop-nav] .floor-nav-inner {
    display: contents;
  }
  [data-desktop-nav] .floor-brand {
    grid-column: 1;
    grid-row: 1;
  }
  [data-desktop-nav] .floor-brand > a > div:first-child {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }
  [data-desktop-nav] .floor-brand > a > div:first-child svg {
    width: 23px;
    height: 23px;
  }
  [data-desktop-nav] .floor-brand a span:first-child {
    font-size: 21px;
  }
  [data-desktop-nav] .floor-brand a span + span, [data-desktop-nav] .floor-company-divider {
    display: none;
  }
  [data-desktop-nav] .floor-company {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  [data-desktop-nav] .floor-account {
    grid-column: 3;
    grid-row: 1;
    gap: 8px;
  }
  [data-desktop-nav] .floor-account > .w-px {
    display: none;
  }
  [data-desktop-nav] .floor-profile > span {
    max-width: 110px;
    font-size: 14px;
  }
  [data-desktop-nav] .floor-profile > div {
    width: 32px;
    height: 32px;
  }
  [data-desktop-nav] .floor-header-inner a span {
    font-weight: 500;
  }
  [data-desktop-nav] nav > a,[data-desktop-nav] nav > div > button {
    position: relative;
    background: transparent;
  }
  [data-desktop-nav] nav [aria-current="page"] {
    background: #ffffff26;
  }
  [data-desktop-nav] nav [aria-current="page"]::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 30%;
    right: 30%;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: #fff;
  }
  [data-desktop-nav] nav > a:hover,[data-desktop-nav] nav > div > button:hover,[data-desktop-nav] nav button[aria-expanded="true"] {
    background: #ffffff26;
  }
  [data-desktop-nav] .floor-nav-tier {
    height: auto;
    padding: 0 0 10px;
    margin: 0;
  }
  [data-desktop-nav] nav {
    grid-column: 2;
    grid-row: 1;
    width: 100%;
    min-width: 0;
    height: 52px;
    gap: 4px;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  [data-desktop-nav] nav > a, [data-desktop-nav] nav > div {
    flex: 0 0 auto;
    min-width: 0;
  }
  [data-desktop-nav] nav > a, [data-desktop-nav] nav > div > button {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    gap: 6px;
    font-size: 14px;
    font-weight: 400;
    border: 0;
    border-radius: 7px;
    color: #fff;
  }
  [data-desktop-nav] nav > a:focus-visible,[data-desktop-nav] nav > div > button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  [data-desktop-nav] nav > a > svg, [data-desktop-nav] nav > div > button > svg:first-child {
    color: #fff;
    width: 21px;
    height: 21px;
  }
  [data-desktop-nav] nav > div > button > svg:last-child {
    width: 12px;
    color: #ffffffb3;
  }
  [data-desktop-nav] nav > div:nth-last-child(-n+2) > .absolute {
    left: auto;
    right: 0;
  }


html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{font-family:var(--vo-font,"Sarabun",Tahoma,sans-serif);color:var(--vo-text)}
.stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--vo-shell-bg,#fff);display:flex;flex-direction:column}
.stage [data-desktop-nav]{flex:none}
.pg{flex:1;min-height:0;overflow:hidden;padding:20px 32px 0}
.cur{position:absolute;z-index:99;width:28px;height:28px;margin:-3px 0 0 -5px;pointer-events:none;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .25s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.rip{position:absolute;z-index:98;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(124,58,237,.32);animation:lvRip .6s ease-out forwards;pointer-events:none}
@keyframes lvRip{from{transform:scale(.2);opacity:1}to{transform:scale(1.7);opacity:0}}
.pressed{transform:scale(.97)}
.focus{border-color:var(--vo-focus,var(--vo-primary))!important;box-shadow:0 0 0 3px var(--vo-primary-soft)}
.fx-in{animation:lvIn .45s ease-out both}
@keyframes lvIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-pop{animation:lvPop .4s ease-out}
@keyframes lvPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fx-flash{animation:lvFlash 1s ease-out}
@keyframes lvFlash{0%{background:var(--vo-primary-soft)}100%{background:transparent}}
.nofx,.nofx *{transition:none!important;animation:none!important}
[hidden]{display:none!important}
.toast{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600;background:var(--vo-ok-bg);color:var(--vo-ok)}
.row-hl>td{background:var(--vo-primary-soft)!important;transition:background .3s}
.cell-bad{background:var(--vo-bad-bg)!important;color:var(--vo-bad)!important;font-weight:700;transition:background .4s,color .4s}
.cell-plan{background:var(--vo-ok-bg)!important;color:var(--vo-ok)!important;font-weight:700}
.vo-tabs-pill{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--vo-surface-2);align-self:flex-start}
.vo-tabs-pill button{padding:6px 14px;border-radius:8px;font-size:15px;color:var(--vo-text-2)}
.vo-tabs-pill button[aria-selected=true]{background:var(--vo-surface);color:var(--vo-text);font-weight:600;box-shadow:0 1px 2px #0001}
</style>
<script>
/* ชิ้นส่วนหน้าตา VibeOps (คลาสคัดจาก dom/*.html ของโปรแกรมจริง) */
window.VO = {
  TH: 'px-3 py-3 text-sm font-semibold text-on-primary select-none border-b border-primary bg-primary-bg relative group after:absolute after:right-0 after:top-3 after:bottom-3 after:w-px after:bg-line last:after:hidden',
  TD: 'px-3 text-sm text-text transition-colors whitespace-nowrap border-b border-line py-2.5',
  TR: 'group transition-all duration-200 outline-none bg-surface hover:bg-surface-2',
  BTN: 'vo-button inline-flex items-center justify-center rounded-control font-medium select-none whitespace-nowrap shrink-0 transition-colors duration-150 min-h-tap px-4 text-base gap-2',
  INPUT: 'w-full bg-surface rounded-control border outline-none text-base text-text placeholder:text-muted border-line-strong transition-colors h-tap px-3',
  th(t, o = {}) { return `<th class="${this.TH}${o.r ? ' text-right' : ''}" style="${o.w ? 'width:' + o.w + 'px' : ''}"><div class="flex items-center justify-between space-x-2 w-full group"><div class="flex items-center gap-1 flex-1 min-w-0 select-none${o.r ? ' justify-end' : ''}"><span class="font-semibold text-inherit leading-tight whitespace-nowrap">${t}</span></div></div></th>`; },
  td(h, o = {}) { return `<td class="${this.TD}${o.r ? ' text-right' : ''}${o.c ? ' ' + o.c : ''}"${o.a || ''}>${h}</td>`; },
  table(ths, rows, tb = '') { return `<div class="bg-surface flex flex-col"><div class="overflow-x-auto flex-1 min-h-0 min-w-0 max-w-full"><table class="vo-super-table w-full text-left border-collapse table-fixed"><thead class="sticky top-0 z-10"><tr>${ths}</tr></thead><tbody class="divide-y divide-line"${tb}>${rows}</tbody></table></div></div>`; },
  badge(kind, t) {
    const m = { ok: ['bg-ok-bg text-ok', 'bg-ok'], bad: ['bg-bad-bg text-bad', 'bg-bad'], warn: ['bg-warn-bg text-warn', 'bg-warn'], info: ['bg-info-bg text-info', 'bg-info'], mute: ['bg-surface-2 text-text-2', 'bg-text-2'] }[kind];
    return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-sm font-semibold whitespace-nowrap ${m[0]}"><span aria-hidden="true" class="size-2 shrink-0 rounded-full ${m[1]}"></span>${t}</span>`;
  },
  btn(t, ic, kind = 'p', attr = '') {
    const c = kind === 'p' ? 'bg-primary-bg text-on-primary hover:bg-primary-hover' : 'bg-surface text-text border border-line-strong hover:bg-surface-2';
    return `<button type="button" class="${this.BTN} ${c}" ${attr}>${ic ? `<i data-ic="${ic}" data-s="18"></i>` : ''}${t}</button>`;
  },
  card(title, body, o = {}) { return `<section class="vo-card ${o.p === false ? '' : 'p-4'}" ${o.a || ''}><div class="mb-3 flex items-center justify-between gap-3 ${o.p === false ? 'px-4 pt-4' : ''}"><h2 class="text-base font-medium text-text">${title}</h2>${o.right || ''}</div>${body}</section>`; },
  pagehead(back, h1, o = {}) {
    return `<header class="border-b border-line bg-surface-2 px-6 py-2"><div class="flex min-h-tap items-center justify-between gap-3"><div class="flex min-w-0 items-center gap-2">${back ? `<button type="button" class="inline-flex min-h-tap items-center gap-1.5 rounded-md px-2 text-base text-text-2"><i data-ic="back" data-s="18"></i> <span>${back}</span></button>` : ''}<div class="min-w-0 pl-1">${o.code ? `<div class="text-sm text-text-2">${o.code}</div>` : ''}<h1 class="text-lg leading-snug text-text"${o.h1a || ''}>${h1}</h1></div>${o.badge ? `<div class="ml-2 shrink-0">${o.badge}</div>` : ''}</div><div class="flex shrink-0 items-center gap-3">${o.right || ''}</div></div></header>`;
  }
};
</script>

<style>
.cmp td{padding-top:6px;padding-bottom:6px}
.grid12 th{padding:6px 4px!important;text-align:center}
.grid12 th .wk{display:block;font-size:13px;font-weight:600}.grid12 th .dt{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.grid12 td{padding:5px 4px!important;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.grid12 td:first-child{text-align:left;padding-left:12px!important;color:var(--vo-text-2);font-size:14px}
.grid12 tr.sum td{font-weight:600;color:var(--vo-text)}
.grid12 tr.sum td:first-child{color:var(--vo-text)}
.cell-by{background:var(--vo-warn-bg)!important;color:var(--vo-warn)!important;font-weight:700;font-size:13px!important}
.fld{display:flex;flex-direction:column}.fld label{font-size:14px;font-weight:500;color:var(--vo-text-2);margin-bottom:5px}
.fake{display:flex;align-items:center;height:40px;border:1px solid var(--vo-line-strong);border-radius:var(--vo-radius-control,8px);padding:0 12px;background:var(--vo-surface);font-size:16px;color:var(--vo-text);white-space:nowrap;overflow:hidden}
#body>*{flex:none}
.sm-btn{min-height:34px!important;padding:0 12px!important;font-size:14px!important}
</style>
<style>*{caret-color:transparent!important}.caret,.cursor-blink{display:none!important}</style></head>

<script>

const SAFE = 2;
const proj = add => { let b = 3; return G.map((g, i) => (b = b + PO[i] + (add ? PL[i] : 0) - g)); };
const BEFORE = proj(0), AFTER = proj(1);
const PARTS = [
  ['P-AIR-FILTER-GA37', 'ไส้กรองอากาศคอมเพรสเซอร์ GA37', 4, 1, 2, 2, 21],
  ['P-OIL-FILTER-GA37', 'ไส้กรองน้ำมันคอมเพรสเซอร์ GA37', 0, 0, 0, 1, 14, 'สัปดาห์ 2', '2 ชิ้น', '23 พ.ย. 69', '2,300.00'],

  ['P-OIL-ROTO', 'น้ำมันคอมเพรสเซอร์ Roto-Inject (ถัง 20 ลิตร)', 2, 0, 0, 1, 10],

const ROWS = [['pm', 'PM ตามแผน (5 เครื่อง)'], ['cm', 'งานซ่อม CM พยากรณ์'], ['g', 'ความต้องการรวม', 'sum'], ['po', 'รับเข้าตาม PO ค้างรับ'], ['b', 'คงเหลือ (ก่อนสั่ง)', 'sum'], ['pl', 'สั่งตามแผน (ของเข้า)'], ['by', 'วันต้องสั่ง'], ['af', 'คงเหลือหลังสั่ง', 'sum']];

LIVE.run({

        ${V.td(`<span class="lo">${p[7] || '—'}</span>`)}${V.td(`<span class="tabular-nums q">${p[8] || '—'}</span>`, { r: 1 })}${V.td(`<span class="tabular-nums by${p[9] ? ' font-semibold text-warn' : ''}">${p[9] || '—'}</span>`)}${V.td(`<span class="tabular-nums val">${p[10] || '—'}</span>`, { r: 1 })}${V.td(act)}</tr>`;
    }).join('');

    const grows = ROWS.map(r => `<tr class="bg-surface ${r[2] || ''}" id="g-${r[0]}"><td class="border-b border-line">${r[1]}</td>${WK.map(() => `<td class="c border-b border-line"></td>`).join('')}</tr>`).join('');
    st.querySelector('#body').innerHTML = `
      <div class="vo-card cmp" style="padding:0"><div class="flex items-center justify-between px-3 py-1.5 border-b border-line"><span class="text-xs text-muted">4 แถว · ต้องสั่ง 3 รายการ</span><span class="text-xs text-muted">ขั้นต่ำ = safety stock · รอของ = ผู้ขาย + ภายใน</span></div>${V.table(ths, rows)}</div>
      <section class="vo-card" id="gridCard" style="padding:0"><div class="flex items-center justify-between gap-3 px-4 py-2.5"><h2 class="text-base font-medium text-text" id="gTitle">เลือกอะไหล่เพื่อดูรายสัปดาห์</h2><span class="text-sm text-text-2" id="gMeta"></span></div>
        <div class="grid12">${V.table(gth, grows)}</div></section>
      <section class="vo-card" id="pr" hidden style="padding:0">
        <header class="border-b border-line bg-surface-2 px-5 py-2"><div class="flex min-h-tap items-center justify-between gap-3"><div class="flex items-center gap-3"><h1 class="text-lg leading-snug text-text">รายงานรายการที่ต้องสั่งซื้อ</h1><span class="tabular-nums text-base text-text-2">MRP · 19 พ.ย. 69</span><span id="prSt">${V.badge('warn', 'ยังไม่ส่ง')}</span></div><div class="flex items-center gap-3"><span id="tst2"></span>${V.btn('พิมพ์ PDF', 'list', 's')}${V.btn('ส่งออก Excel ให้จัดซื้อ', 'send', 'p', 'id="bSend"')}</div></div></header>
        <div class="grid gap-4 px-5 pt-3 pb-3" style="grid-template-columns:2fr 1fr 1fr 1.4fr 1.4fr">
          <div class="fld"><label>ผู้ขายประจำ (อ้างอิง)</label><span class="fake" data-f="หจก. ไทยแอร์คอมพ์ ซัพพลาย"></span></div>
          <div class="fld"><label>ส่งถึง</label><span class="fake" data-f="ฝ่ายจัดซื้อโรงงาน"></span></div>
          <div class="fld"><label>วันที่ต้องการ</label><span class="fake" data-f="28-12-2026"></span></div>
          <div class="fld"><label>เลขอ้างอิง</label><span class="fake" data-f="MRP · PM-CMP-GA37"></span></div>
          <div class="fld"><label>ผู้จัดทำ</label><span class="fake" data-f="วรวุฒิ เจริญผล"></span></div></div>
        ${V.table(V.th('#', { w: 48 }) + V.th('รหัส', { w: 200 }) + V.th('รายการ') + V.th('จำนวน', { w: 90, r: 1 }) + V.th('หน่วย', { w: 80 }) + V.th('ราคา/หน่วย', { w: 120, r: 1 }) + V.th('วันที่ต้องการ', { w: 140 }) + V.th('จำนวนเงิน', { w: 140, r: 1 }) + V.th('ที่มา', { w: 190 }),
          [['28-12-2026', 'สัปดาห์ 6 · สั่งภายใน 7 ธ.ค.'], ['11-01-2027', 'สัปดาห์ 8 · สั่งภายใน 21 ธ.ค.']].map((l, i) => `<tr class="${V.TR} pl" hidden>${V.td(`<span class="num text-sm text-muted">${i + 1}</span>`)}${V.td('<span class="tabular-nums">P-AIR-FILTER-GA37</span>')}${V.td('ไส้กรองอากาศคอมเพรสเซอร์ GA37')}${V.td('<span class="tabular-nums">2</span>', { r: 1 })}${V.td('ชิ้น')}${V.td('<span class="tabular-nums">1,850.00</span>', { r: 1 })}${V.td(`<span class="tabular-nums">${l[0]}</span>`)}${V.td('<span class="tabular-nums">3,700.00</span>', { r: 1 })}${V.td(`<span class="text-text-2">${l[1]}</span>`)}</tr>`).join(''))}
        <div class="flex items-center justify-end gap-4 px-5 py-3"><span class="text-base text-text-2">ยอดรวม (บาท)</span><span class="text-2xl font-medium tabular-nums text-text" id="prTot">0.00</span></div>
      </section>`;
  },
  steps: [
    { cap: 'แผนความต้องการอะไหล่ ดูล่วงหน้า 12 สัปดาห์ทุกรายการ', run: async a => {} },
    { cap: 'เลือกไส้กรองอากาศ GA37 — รวมรอบ PM ของคอมเพรสเซอร์ 5 เครื่อง กับงานซ่อมที่คาดว่าจะเกิด', run: async a => {
      await a.click('#p0', el => a.cls(el, 'row-hl'));
      a.text('#gTitle', 'P-AIR-FILTER-GA37 · ไส้กรองอากาศคอมเพรสเซอร์ GA37'); a.set('#gMeta', 'คงเหลือ 4 − จอง 1 = <b class="text-text">3</b> · ขั้นต่ำ 2 · รอของ 21 วัน · สั่งทีละ 2 · 1,850 บาท/ชิ้น');
      a.off();
      const pm = a.$(cellsOf('pm')).parentElement.querySelectorAll('td.c'), cm = a.$(cellsOf('cm')).parentElement.querySelectorAll('td.c');
      for (let i = 0; i < 12; i++) { pm[i].textContent = PM[i] || '·'; cm[i].textContent = CM[i] || '·'; a.show([pm[i], cm[i]]); await a.w(60); }
    } },
    { cap: 'รวมเป็นความต้องการต่อสัปดาห์ และนับของที่สั่งไว้แล้วซึ่งจะเข้าสัปดาห์ 3', run: async a => {
      const g = a.$('#g-g').querySelectorAll('td.c'), po = a.$('#g-po').querySelectorAll('td.c');
      for (let i = 0; i < 12; i++) { g[i].textContent = G[i] || '·'; po[i].textContent = PO[i] ? '+' + PO[i] : ''; a.show([g[i], po[i]]); await a.w(60); }
      a.cls(po[2], 'cell-plan');
    } },
    { cap: 'คงเหลือรายสัปดาห์ — ช่องแดงคือต่ำกว่าขั้นต่ำ 2 ชิ้น ของหมดจริงในสัปดาห์ 8', run: async a => {
      const b = a.$('#g-b').querySelectorAll('td.c');
      for (let i = 0; i < 12; i++) { b[i].textContent = BEFORE[i]; a.show(b[i], 'fx-pop'); if (BEFORE[i] < SAFE) a.cls(b[i], 'cell-bad'); await a.w(150); }
    } },
    { cap: 'ระบบแนะนำสั่ง 2 + 2 ชิ้น ต้องสั่งภายใน 7 ธ.ค. และ 21 ธ.ค. (รอของ 21 วัน)', run: async a => {
      const pl = a.$('#g-pl').querySelectorAll('td.c'), by = a.$('#g-by').querySelectorAll('td.c'), af = a.$('#g-af').querySelectorAll('td.c');
      for (const [i, d] of [[5, '7 ธ.ค.'], [7, '21 ธ.ค.']]) { pl[i].textContent = '+2'; a.cls(pl[i], 'cell-plan'); a.show(pl[i], 'fx-pop'); await a.w(250); by[i].textContent = 'สั่ง ' + d; a.cls(by[i], 'cell-by'); a.show(by[i], 'fx-pop'); await a.w(350); }
      for (let i = 0; i < 12; i++) { af[i].textContent = AFTER[i]; a.show(af[i]); await a.w(60); }

      await a.count('#prTot', 7400, { dec: 2, dur: 800 });
    } },
    { cap: 'ส่งออกให้ฝ่ายจัดซื้อ — ไปเปิดใบสั่งซื้อในระบบจัดซื้อเดิมของโรงงาน', run: async a => {
      await a.click('#bSend'); a.set('#prSt', V.badge('ok', 'ส่งจัดซื้อแล้ว'));
      a.toast('#tst2', 'ส่งออกแล้ว'); a.set('#act0', V.badge('ok', 'ส่งจัดซื้อแล้ว'));
    } },
  ]
});
</script>
</body>
</html>
